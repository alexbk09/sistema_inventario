services:
  app:
    build: .
    image: sistema_inventario_app
    container_name: sistema_inventario_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:CGPpIVpUwZM+wdi93euMtFp3B171yi7/o+Atdn6e1A0=
      - APP_AUTO_SEED=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sistema_inventario
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
      # - IMAGE_AI_URL=http://image_ai:8001/process
    depends_on:
      db:
        condition: service_healthy
      # - image_ai
    ports:
      - "9000:9000" # PHP-FPM
      - "5173:5173" # Vite
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000, $$errno, $$errstr, 2); exit($$socket ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - sistema_inventario
  nginx:
    image: nginx:1.25
    container_name: sistema_inventario_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sistema_inventario
  db:
    image: mysql:8.0
    container_name: sistema_inventario_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_inventario
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sistema_inventario

  # image_ai:
  #   build:
  #     context: ./tools
  #     dockerfile: Dockerfile
  #   container_name: sistema_inventario_image_ai
  #   restart: unless-stopped
  #   ports:
  #     - "8001:8001"
  #   networks:
  #     - sistema_inventario

volumes:
  db_data:

networks:
  sistema_inventario:
    driver: bridge
